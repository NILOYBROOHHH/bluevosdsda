      }

      }

                  prod.imageUrl &&
                  typeof prod.imageUrl === 'string' &&

      state.toast = { message, type };
      render();
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        state.toast = null;
        render();
      }, 3200);
    }

    // Format numeric amounts into Bangladeshi Taka (BDT)
    function formatBDT(amount) {
      const num = Number(amount || 0);
      const formatted = Number.isInteger(num) ? num.toLocaleString('en-US') : num.toFixed(2);
      return `৳${formatted}`;
    }

    // Compute current Robux availability status
    function getRobuxStockStatus() {
      const stock = Number(state.robux.robuxStock || 0);
      const lowThreshold = Number(state.robux.lowStockThreshold || 0);
      if (state.robux.forceOutOfStock || stock <= 0) {
        return { available: false, label: 'Out of stock', tone: 'rose' };
      }
      if (stock <= lowThreshold) {
        return { available: true, label: 'Low stock', tone: 'amber' };
      }
      return { available: true, label: 'In stock', tone: 'emerald' };
    }

    // Format countdown string until configured restock timestamp
    function getRestockCountdownText() {
      if (!state.robux.restockAt) return '';
      const target = new Date(state.robux.restockAt).getTime();
      if (!Number.isFinite(target)) return '';
      const diffMs = target - (state.nowTick || Date.now());
      if (diffMs <= 0) return 'Restocking Soon';
      const totalSec = Math.floor(diffMs / 1000);
      const hrs = String(Math.floor(totalSec / 3600)).padStart(2, '0');
      const mins = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
      const secs = String(totalSec % 60).padStart(2, '0');
      return `${hrs}h : ${mins}m : ${secs}s`;
    }

    function getCartCount() {
      return state.cart.reduce((sum, item) => sum + (item.itemType === 'robux' ? 1 : Number(item.quantity || 1)), 0);
    }

    function getCartTotalBDT() {
      if (!Array.isArray(state.cart)) state.cart = [];
      return state.cart.reduce((sum, item) => sum + Math.round(Number(item.unitPriceBdt || 0) * Number(item.quantity || 1)), 0);
    }

    function addToCart(newItem) {
      if (!Array.isArray(state.cart)) state.cart = [];
      const existing = state.cart.find((i) => i.key === newItem.key);
      if (existing && newItem.itemType !== 'robux') {
        existing.quantity = Number(existing.quantity) + Number(newItem.quantity || 1);
      } else {
        state.cart.push(newItem);
      }
      saveState();
      showToast(`${newItem.title} added to cart!`, 'success');
      render();
    }

    function removeFromCart(key) {
      state.cart = state.cart.filter((i) => i.key !== key);
      saveState();
      render();
    }

    // Role-based access control helpers (requires a logged-in staff/admin/owner session)
    function isStaffSession() {
      if (!state.currentUser || !state.currentUser.email) return false;
      return ['owner', 'admin', 'stock_manager', 'order_manager'].includes(state.activeRole);
    }

    function canSeeStaffAdminControls() {
      return isStaffSession();
    }

    function canAccessAdminTab(tab) {
      if (!isStaffSession()) return false;
      const role = state.activeRole;
      if (role === 'owner' || role === 'admin') return true;
      if (role === 'stock_manager') return tab === 'stock' || tab === 'marketplace';
      if (role === 'order_manager') return tab === 'orders';
      return false;
    }

    function getAllowedAdminTabsForCurrentRole() {
      if (!isStaffSession()) return [];
      const allTabs = [
        { id: 'dashboard', label: '📊 Dashboard' },
        { id: 'orders', label: '📦 Orders' },
        { id: 'marketplace', label: '🛍️ Marketplace' },

      return allTabs.filter((t) => canAccessAdminTab(t.id));
    }

    function canManagePaymentNumbers() {
      return isStaffSession() && state.activeRole === 'owner';
    }

      return isStaffSession() && state.activeRole === 'owner';
    }

      return isStaffSession() && (state.activeRole === 'owner' || state.activeRole === 'admin');

    function isCurrentUserAuthorizedOwner() {
      const authorizedList = getAuthorizedOwnerEmails();
      if (!state.currentUser || !state.currentUser.email) {
        return isStaffSession() && state.activeRole === 'owner';
      }
      return authorizedList.includes(normalizeEmail(state.currentUser.email));
    }

    function canReceiveOwnerRole(targetEmail) {
      if (!state.exclusiveOwnerOnlyMe) return true;
      const authorizedList = getAuthorizedOwnerEmails();
      return authorizedList.includes(normalizeEmail(targetEmail));
    }

    function canSeeStaffEmails() {
      return isStaffSession() && state.activeRole === 'owner';
    }

    function displayUserEmail(email, isStaffAccount = false) {
      if (!email) return '';
      if (!isStaffAccount || canSeeStaffEmails()) {
        return escapeHtml(email);
      }
      const parts = String(email).split('@');
      const local = parts[0] || '';
      const domain = parts[1] || 'gmail.com';
      const prefix = local.slice(0, 2);
      return `${escapeHtml(prefix)}••••@${escapeHtml(domain)} <span class="ml-1 text-[10px] font-semibold text-amber-700">(Hidden • Owner Only)</span>`;
    }

    function getAvailableRolesToAssign() {
      if (!isStaffSession()) return [];
      if (state.activeRole === 'owner') {
        const canGiveOwner = !state.exclusiveOwnerOnlyMe || isCurrentUserAuthorizedOwner();
        return canGiveOwner
          ? ['owner', 'admin', 'stock_manager', 'order_manager']
          : ['admin', 'stock_manager', 'order_manager'];
      }
      if (state.activeRole === 'admin') {
        return ['admin', 'stock_manager', 'order_manager'];
      }
      return [];
    }

    function isValidGmailAddress(email) {
      const clean = normalizeEmail(email);
      const match = clean.match(/^([a-z0-9](?:[a-z0-9._+-]{0,62}[a-z0-9])?)@gmail\.com$/);
      if (!match) return false;
      const localPart = match[1];
      if (localPart.includes('..')) return false;
      if (localPart.length < 3 || localPart.length > 30) return false;
      const compact = localPart.replace(/[^a-z0-9]/g, '');
      const vowels = (compact.match(/[aeiou]/g) || []).length;
      const digits = (compact.match(/[0-9]/g) || []).length;
      if (compact.length >= 10 && vowels === 0 && digits === 0) return false;
      if (/(.)\1{4,}/.test(compact)) return false;
      return true;
    }

    function isApprovedGmailForSignup(email) {
      const clean = normalizeEmail(email);
      if (!state.requireApprovedGmailForSignup) return true;
      const allowlist = (state.approvedGmails || []).map((e) => normalizeEmail(e));
      return allowlist.includes(clean);
    }

    function getSignupGmailStatus(email) {
      const clean = normalizeEmail(email);
      if (!clean) {
        return { ok: false, tone: 'neutral', message: 'Enter a Gmail address to check availability.' };
      }
      if (!isValidGmailAddress(clean)) {
        return {
          ok: false,
          tone: 'error',
          message: `✗ "${clean}" is not a valid Gmail address (must be a real name@gmail.com format without extra text).`,
        };
      }
      const alreadyCreated = (state.users || []).some((u) => normalizeEmail(u.email) === clean);
      if (alreadyCreated) {
        return {
          ok: false,
          tone: 'error',
          message: `✗ "${clean}" already has an account. Please log in instead.`,
        };
      }
      if (state.requireApprovedGmailForSignup && !isApprovedGmailForSignup(clean)) {
        return {
          ok: false,
          tone: 'error',
          message: `✗ "${clean}" does not exist in the approved Gmail list — account creation is blocked.`,
        };
      }
      return {
        ok: true,
        tone: 'success',
        message: `✓ "${clean}" is available to create a new account.`,
      };
    }

    function getLoginGmailStatus(email) {
      const clean = normalizeEmail(email);
      if (!clean) {
        return { ok: false, tone: 'neutral', message: 'Enter your registered Gmail address to log in.' };
      }
      if (!isValidGmailAddress(clean) && !clean.includes('@')) {
        return { ok: false, tone: 'error', message: `✗ "${clean}" is not a valid email address.` };
      }
      const createdAccount = (state.users || []).some((u) => normalizeEmail(u.email) === clean);
      if (!createdAccount) {
        return {
          ok: false,
          tone: 'error',
          message: `✗ Account for "${clean}" has not been created yet — login is blocked until you sign up.`,
        };
      }
      return {
        ok: true,
        tone: 'success',
        message: `✓ Account found for "${clean}". Enter your password to log in.`,
      };
    }

    function refreshLiveAuthStatus() {
      const emailInput = document.getElementById('authEmail');
      const statusBox = document.getElementById('authGmailStatusBox');
      if (!emailInput || !statusBox) return;
      const mode = state.authModal || 'login';
      const info = mode === 'signup' ? getSignupGmailStatus(emailInput.value) : getLoginGmailStatus(emailInput.value);
      const cls =
        info.tone === 'success'

          : info.tone === 'error'

          : 'bg-slate-50 border-slate-200 text-slate-600';
      statusBox.className = `p-3 rounded-xl border text-xs font-semibold ${cls}`;
      statusBox.textContent = info.message;
    }

                    max="100000"
                    value="${defaultRobux}"
                    oninput="setRobuxCalcAmount(this.value, true)"
                    class="w-full h-11 px-4 rounded-xl border border-slate-200 bg-[#F4F7FC] font-display font-bold text-base text-slate-900 focus:outline-none focus:bg-white focus:border-brand-600"

                    <span>Selected Robux</span>
                    <span id="robuxSummaryQty" class="font-display font-bold text-slate-900">${defaultRobux.toLocaleString('en-US')} Robux</span>
                  </div>
                  <div class="flex justify-between text-sm text-slate-600">
                    <span>Current Rate</span>
                    <span class="font-semibold text-slate-800">${formatBDT(state.robux.ratePerRobux)} / R$</span>
                  </div>
                  <div class="border-t border-slate-200 pt-3 flex justify-between items-baseline">

            </div>
          </div>
        </main>

    // Marketplace catalog view
    function renderMarketplacePage() {
      const dynamicNames = (state.categories || []).map((c) => c.name);
      const categories = ['All', ...dynamicNames];

      const filtered = state.products.filter((p) => {
        if (!p.isActive) return false;
        const matchesCat = state.selectedCategory === 'All' || p.category === state.selectedCategory;
        const matchesQuery =
          !q ||
          p.title.toLowerCase().includes(q) ||
          p.description.toLowerCase().includes(q) ||
          p.category.toLowerCase().includes(q);
        return matchesCat && matchesQuery;
      });

      const activeCatObj = (state.categories || []).find((c) => c.name === state.selectedCategory);

      return `
        <main class="max-w-[1280px] w-full mx-auto px-4 sm:px-6 py-8 space-y-6">

              <p class="text-sm text-slate-500 mt-1">

            </div>
            <div class="flex flex-wrap gap-2">
              ${categories.map((cat) => `

                  <div>

                      <img
                        src="${escapeHtml(prod.imageUrl || prod.logoUrl || FALLBACK_IMG)}"

                      <img

                        onerror="this.onerror=null;this.src='${FALLBACK_IMG}';"

                    <div class="flex items-center justify-between text-[11px] font-semibold text-slate-500 mb-1">
                      <span>${escapeHtml(prod.category)}</span>
                      <span>★ ${Number(prod.ratingCount || 0).toLocaleString('en-US')} ratings</span>
                    </div>
                    <button type="button" onclick="navigate('product', { productId: '${prod.id}' })" class="text-left">
                      <h3 class="font-display font-bold text-base text-slate-950 line-clamp-1">${escapeHtml(prod.title)}</h3>
                    </button>
                    <p class="text-xs text-slate-500 line-clamp-2 mt-1">${escapeHtml(prod.description)}</p>
                  </div>

                  <div class="pt-4 mt-4 border-t border-slate-100">
                    <div class="flex items-center justify-between mb-3">
                      <span class="font-display font-extrabold text-lg text-slate-950">${formatBDT(prod.priceBdt)}</span>
                      <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold ${

                    <div class="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        onclick="navigate('product', { productId: '${prod.id}' })"

                        Details

                      <button

    // Manual mobile banking checkout view (bKash, Nagad, Upay, Rocket)
    function renderCheckoutPage() {
      const enabledMethods = state.paymentMethods.filter((m) => m.isEnabled);
      const totalBdt = getCartTotalBDT();
      const requiresRoblox = state.cart.some((i) => i.itemType === 'robux' || i.requiresRobloxUsername);
      const requiresDiscord = state.cart.some((i) => i.requiresDiscordTag || i.category === 'Discord Items');
      const selectedMethodId = window.__selectedPaymentMethodId || (enabledMethods[0] && enabledMethods[0].id) || '';
      const activeMethod = enabledMethods.find((m) => m.id === selectedMethodId) || enabledMethods[0] || null;

      return `
        <main class="max-w-[1140px] w-full mx-auto px-4 sm:px-6 py-8 space-y-6">
          <h1 class="font-display font-extrabold text-2xl sm:text-3xl text-slate-950">Checkout & Manual Payment</h1>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-5 bg-white rounded-[20px] border border-slate-200/80 p-5 soft-shadow space-y-4 h-fit">
              <h2 class="font-display font-bold text-base text-slate-950">Order Summary</h2>
              ${
                state.cart.length === 0
                  ? `<div class="py-8 text-center text-sm text-slate-500">
                      Your cart is empty. <button type="button" onclick="navigate('marketplace')" class="text-brand-600 font-semibold underline">Browse Marketplace</button>
                     </div>`
                  : `
                    <div class="divide-y divide-slate-100">
                      ${state.cart.map((item) => `
                        <div class="py-3 flex items-center justify-between gap-3">
                          <div>
                            <div class="font-semibold text-sm text-slate-900">${escapeHtml(item.title)}</div>
                            <div class="text-xs text-slate-500">
                              ${item.itemType === 'robux' ? `${Number(item.quantity).toLocaleString('en-US')} Robux` : `Qty: ${item.quantity}`} × ${formatBDT(item.unitPriceBdt)}
                            </div>
                          </div>
                          <div class="flex items-center gap-3">
                            <span class="font-display font-bold text-sm text-slate-950">
                              ${formatBDT(Number(item.unitPriceBdt) * Number(item.quantity))}
                            </span>
                            <button type="button" onclick="removeFromCart('${item.key}')" class="text-xs text-rose-600 hover:underline">Remove</button>
                          </div>
                        </div>
                      `).join('')}
                    </div>
                    <div class="pt-3 border-t border-slate-200 flex items-center justify-between">
                      <span class="font-bold text-sm text-slate-800">Total to Send (BDT)</span>
                      <span class="font-display font-extrabold text-xl text-brand-600">${formatBDT(totalBdt)}</span>
                    </div>
                  `
              }
            </div>

            <div class="lg:col-span-7 bg-white rounded-[20px] border border-slate-200/80 p-5 sm:p-6 soft-shadow">
              ${
                enabledMethods.length === 0
                  ? `<div class="p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-sm font-semibold">
                      No payment methods are currently enabled by the store owner. Please try again later.
                     </div>`
                  : `
                    <form onsubmit="submitManualOrder(event)" class="space-y-5">
                      <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">
                          1. Select Enabled Payment Method
                        </label>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                          ${enabledMethods.map((m) => `
                            <button
                              type="button"
                              onclick="selectCheckoutMethod('${m.id}')"
                              class="p-3 rounded-xl border text-left transition ${
                                activeMethod && activeMethod.id === m.id
                                  ? 'border-brand-600 bg-brand-50/70'
                                  : 'border-slate-200 bg-[#F4F7FC] hover:border-slate-300'
                              }"
                            >
                              <span class="inline-block px-2 py-0.5 rounded text-white text-[11px] font-bold mb-1" style="background:${m.badgeBg}">${escapeHtml(m.badgeText)}</span>
                              <div class="font-display font-bold text-sm text-slate-900">${escapeHtml(m.name)}</div>
                              <div class="text-[11px] text-slate-500">${escapeHtml(m.accountType)}</div>
                            </button>
                          `).join('')}
                        </div>
                      </div>

                      ${
                        activeMethod
                          ? `
                            <div class="p-4 rounded-2xl bg-[#F4F7FC] border border-slate-200/80 space-y-2">
                              <div class="flex flex-wrap items-center justify-between gap-2">
                                <span class="text-xs font-bold uppercase tracking-wider text-slate-500">
                                  ${escapeHtml(activeMethod.name)} (${escapeHtml(activeMethod.accountType)}) Receiving Number
                                </span>
                                <span class="font-display font-extrabold text-sm text-brand-600">
                                  Exact Amount: ${formatBDT(totalBdt)}
                                </span>
                              </div>
                              <div class="flex items-center justify-between gap-3 bg-white p-3 rounded-xl border border-slate-200">
                                <span class="font-mono font-bold text-base text-slate-950">${escapeHtml(activeMethod.receivingNumber)}</span>
                                <button
                                  type="button"
                                  onclick="copyText('${escapeHtml(activeMethod.receivingNumber)}', 'Receiving number copied!')"

                                >
                                  Copy Number

                              </div>
                              <p class="text-xs text-slate-600">${escapeHtml(activeMethod.instructionNote || '')}</p>

                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                          <label class="block text-xs font-bold text-slate-700 mb-1">
                            Transaction ID (TrxID) <span class="text-rose-600">*</span>

                            id="checkoutTrxId"
                            type="text"
                            required
                            placeholder="e.g. 9A7B6C5D4E"
                            class="w-full h-10 px-3.5 rounded-xl border border-slate-200 bg-[#F4F7FC] text-sm font-mono uppercase focus:bg-white focus:border-brand-600 focus:outline-none"
                          />
                        </div>

                        <div>
                          <label class="block text-xs font-bold text-slate-700 mb-1">
                            Last 4 Digits of Sender Number <span class="text-rose-600">*</span>
                          </label>
                          <input
                            id="checkoutLast4"
                            type="text"
                            required
                            maxlength="4"
                            pattern="[0-9]{4}"
                            placeholder="e.g. 1234"
                            class="w-full h-10 px-3.5 rounded-xl border border-slate-200 bg-[#F4F7FC] text-sm font-mono focus:bg-white focus:border-brand-600 focus:outline-none"

                          id="checkoutWhatsapp"
                          type="tel"

                          placeholder="e.g. +88017XXXXXXXX or 017XXXXXXXX"

                        />

                      ${
                        requiresRoblox
                          ? `
                            <div>
                              <label class="block text-xs font-bold text-slate-700 mb-1">
                                Roblox Username <span class="text-rose-600">*</span>
                              </label>
                              <input
                                id="checkoutRobloxUser"
                                type="text"
                                required
                                minlength="3"
                                placeholder="Enter exact Roblox username"
                                class="w-full h-10 px-3.5 rounded-xl border border-slate-200 bg-[#F4F7FC] text-sm focus:bg-white focus:border-brand-600 focus:outline-none"
                              />
                            </div>
                          `
                          : ''
                      }

                      ${
                        requiresDiscord
                          ? `
                            <div>
                              <label class="block text-xs font-bold text-slate-700 mb-1">
                                Discord Username / Server Invite Link <span class="text-rose-600">*</span>
                              </label>
                              <input
                                id="checkoutDiscordUser"
                                type="text"
                                required
                                minlength="2"
                                placeholder="e.g. niloykhan0 or discord.gg/yourserver"
                                class="w-full h-10 px-3.5 rounded-xl border border-slate-200 bg-[#F4F7FC] text-sm focus:bg-white focus:border-brand-600 focus:outline-none"
                              />
                            </div>
                          `
                          : ''
                      }

                      <button
                        type="submit"
                        ${state.cart.length === 0 ? 'disabled' : ''}
                        class="w-full py-3 px-4 rounded-xl bg-brand-600 hover:bg-brand-700 disabled:bg-slate-300 text-white font-display font-bold text-sm shadow-sm transition"
                      >
                        Submit Order (Status: Pending)
                      </button>
                    </form>
                  `
              }
            </div>
          </div>
        </main>
      `;
    }

        ? state.orders.filter((o) => normalizeEmail(o.customerEmail) === currentEmail)

              <h1 class="font-display font-extrabold text-2xl sm:text-3xl text-slate-950">Order History & Status</h1>

    // Admin sub-tab content renderer
    function renderAdminTabContent(tab) {
      const isPcMode = state.viewMode === 'pc';

      if (tab === 'dashboard') {
        const pendingCount = state.orders.filter((o) => o.status === 'Pending').length;
        const completedRevenue = state.orders
          .filter((o) => o.status === 'Completed')
          .reduce((acc, o) => acc + Number(o.totalAmountBdt), 0);
        const lowStockProducts = state.products.filter((p) => Number(p.stockQuantity) <= Number(p.lowStockThreshold || 5));
        const robuxLow = Number(state.robux.robuxStock) <= Number(state.robux.lowStockThreshold || 5000) || state.robux.forceOutOfStock;
        const lowStockTotal = lowStockProducts.length + (robuxLow ? 1 : 0);

        return `
          <div class="grid ${isPcMode ? 'grid-cols-4' : 'grid-cols-1 sm:grid-cols-2 xl:grid-cols-4'} gap-4">
            <div class="bg-white rounded-[18px] border border-slate-200/80 p-4 soft-shadow">
              <div class="text-xs font-semibold text-slate-500">Total Orders</div>
              <div class="font-display font-extrabold text-2xl text-slate-950 mt-1">${state.orders.length}</div>
            </div>
            <div class="bg-white rounded-[18px] border border-slate-200/80 p-4 soft-shadow">
              <div class="text-xs font-semibold text-slate-500">Pending Orders</div>
              <div class="font-display font-extrabold text-2xl text-amber-600 mt-1">${pendingCount}</div>
            </div>
            <div class="bg-white rounded-[18px] border border-slate-200/80 p-4 soft-shadow">
              <div class="text-xs font-semibold text-slate-500">Completed Revenue</div>
              <div class="font-display font-extrabold text-2xl text-brand-600 mt-1">${formatBDT(completedRevenue)}</div>
            </div>
            <div class="bg-white rounded-[18px] border border-slate-200/80 p-4 soft-shadow">
              <div class="text-xs font-semibold text-slate-500">Low / Out-of-Stock Alerts</div>
              <div class="font-display font-extrabold text-2xl text-rose-600 mt-1">${lowStockTotal}</div>
            </div>
          </div>
        `;
      }

      if (tab === 'orders') {
        const statusFilter = window.__adminOrderStatusFilter || 'All';
        const searchTerm = (window.__adminOrderSearch || '').trim().toLowerCase();
        const rows = state.orders.filter((o) => {
          const matchesStatus = statusFilter === 'All' || o.status === statusFilter;
          const matchesSearch =
            !searchTerm ||
            o.orderNumber.toLowerCase().includes(searchTerm) ||
            o.trxId.toLowerCase().includes(searchTerm) ||
            (o.robloxUsername && o.robloxUsername.toLowerCase().includes(searchTerm)) ||
            (o.discordUsername && o.discordUsername.toLowerCase().includes(searchTerm)) ||
            o.customerEmail.toLowerCase().includes(searchTerm);
          return matchesStatus && matchesSearch;
        });

        return `

                  type="text"
                  value="${escapeHtml(window.__adminOrderSearch || '')}"

                    <th class="py-2.5 px-3">Update Status</th>

                </thead>
                <tbody class="divide-y divide-slate-100 text-xs">
                  ${rows.map((o) => `

                      <td class="py-3 px-3">

                      <td class="py-3 px-3">
                        <div><strong>${escapeHtml(o.paymentMethodName)}</strong> • Last 4: <span class="font-mono">${escapeHtml(o.senderLast4)}</span></div>
                        <div class="font-mono text-slate-600">TrxID: ${escapeHtml(o.trxId)}</div>

                      <td class="py-3 px-3">${renderStatusBadge(o.status)}</td>
                      <td class="py-3 px-3">

                          </form>
                        </div>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;

                  />
                  ${

                      ? `<img src="${escapeHtml(uploadedLogoPreview)}" alt="Logo preview" class="w-8 h-8 rounded-lg object-cover border border-slate-200 shrink-0" />`

        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')

    function proceedRobuxToCheckout() {
      const status = getRobuxStockStatus();
      if (!status.available) {
        showToast('Robux is currently out of stock.', 'error');
        return;
      }
      const qty = Math.max(10, Number(window.__selectedRobuxAmount || 800));
      if (qty > Number(state.robux.robuxStock)) {
        showToast(`Only ${Number(state.robux.robuxStock).toLocaleString('en-US')} Robux available in stock.`, 'error');
        return;
      }
      state.cart = state.cart.filter((i) => i.itemType !== 'robux');
      addToCart({
        key: `robux-${qty}`,
        itemType: 'robux',
        productId: null,
        category: 'Robux',
        title: `${qty.toLocaleString('en-US')} Robux Top-Up`,
        quantity: qty,
        unitPriceBdt: Number(state.robux.ratePerRobux),
        requiresRobloxUsername: true,
        requiresDiscordTag: false,
      });
      navigate('checkout');
    }

    function addProductToCart(productId) {
      const prod = state.products.find((p) => p.id === productId);
      if (!prod || Number(prod.stockQuantity) <= 0) {
        showToast('This product is out of stock.', 'error');
        return;
      }
      addToCart({
        key: `prod-${prod.id}`,
        itemType: 'product',
        productId: prod.id,
        category: prod.category,
        title: prod.title,
        quantity: 1,
        unitPriceBdt: Number(prod.priceBdt),
        requiresRobloxUsername: Boolean(prod.requiresRobloxUsername),
        requiresDiscordTag: Boolean(prod.requiresDiscordTag || prod.category === 'Discord Items'),
      });
    }

        showToast('This product is out of stock.', 'error');

    function submitManualOrder(e) {
      e.preventDefault();
      if (state.cart.length === 0) {
        showToast('Your cart is empty.', 'error');
        return;
      }
      const enabledMethods = state.paymentMethods.filter((m) => m.isEnabled);
      const selectedMethodId = window.__selectedPaymentMethodId || (enabledMethods[0] && enabledMethods[0].id);
      const method = enabledMethods.find((m) => m.id === selectedMethodId);
      if (!method) {
        showToast('Please select an enabled payment method.', 'error');
        return;
      }

      const trxId = (document.getElementById('checkoutTrxId')?.value || '').trim().toUpperCase();
      const senderLast4 = (document.getElementById('checkoutLast4')?.value || '').trim();
      const whatsappNumber = (document.getElementById('checkoutWhatsapp')?.value || '').trim();
      const robloxUser = (document.getElementById('checkoutRobloxUser')?.value || '').trim();
      const discordUser = (document.getElementById('checkoutDiscordUser')?.value || '').trim();

      if (trxId.length < 4) {
        showToast('Enter a valid Transaction ID (TrxID).', 'error');
        return;
      }
      if (!/^[0-9]{4}$/.test(senderLast4)) {
        showToast('Sender last 4 digits must be exactly 4 numeric digits.', 'error');
        return;
      }
      const cleanWhatsappDigits = whatsappNumber.replace(/[^0-9]/g, '');
      if (cleanWhatsappDigits.length < 7) {
        showToast('Please enter a valid WhatsApp number to receive your order.', 'error');
        return;
      }
      const duplicateTrx = state.orders.some((o) => o.trxId.toUpperCase() === trxId && o.status !== 'Rejected');
      if (duplicateTrx) {
        showToast('Duplicate Transaction ID detected. Each order requires a unique TrxID.', 'error');
        return;
      }

      const customerEmail = state.currentUser ? state.currentUser.email : 'guest@bluevolt.bd';
      const nowStr = new Date().toISOString().slice(0, 16).replace('T', ' ');

      for (const item of state.cart) {
        const lineTotal = Math.round(Number(item.unitPriceBdt) * Number(item.quantity));
        const orderNumber = 'BV-' + Math.random().toString(36).substring(2, 10).toUpperCase();
        state.orders.unshift({
          id: 'ord-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5),
          orderNumber,
          customerEmail,
          itemType: item.itemType,
          productId: item.productId || null,
          itemTitle: item.title,
          quantity: Number(item.quantity),
          unitRateBdt: Number(item.unitPriceBdt),
          totalAmountBdt: lineTotal,
          paymentMethodId: method.id,
          paymentMethodName: method.name,
          trxId,
          senderLast4,
          whatsappNumber,
          robloxUsername: item.requiresRobloxUsername ? robloxUser : null,
          discordUsername: (item.requiresDiscordTag || item.category === 'Discord Items') ? discordUser : null,
          status: 'Pending',
          internalNote: '',
          messages: [
            {
              id: 'msg-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5),
              senderRole: 'customer',
              senderName: customerEmail,
              text: `Order placed. WhatsApp for delivery: ${whatsappNumber}`,
              createdAt: nowStr,
            },
          ],
          createdAt: nowStr,
        });

        if (item.itemType === 'robux') {
          state.robux.robuxStock = Math.max(0, Number(state.robux.robuxStock) - Number(item.quantity));
        } else if (item.productId) {
          const prod = state.products.find((p) => p.id === item.productId);
          if (prod) {
            prod.stockQuantity = Math.max(0, Number(prod.stockQuantity) - Number(item.quantity));
          }
        }
      }

      state.cart = [];
      saveState();
      showToast('Order submitted! Status is now Pending verification.', 'success');
      navigate('orders');
    }

    async function triggerForgotPassword() {
      const email = normalizeEmail(document.getElementById('authEmail')?.value || '');
      if (!email) {
        showToast('Enter your email address first to reset your password.', 'error');
        return;
      }
      const exists = (state.users || []).some((u) => normalizeEmail(u.email) === email);
      if (!exists && !supabaseClient) {
        showToast(`No account exists for "${email}" yet.`, 'error');
        return;
      }
      if (supabaseClient) {
        try {
          const { error } = await supabaseClient.auth.resetPasswordForEmail(email);
          if (error) {
            showToast(error.message, 'error');
            return;
          }
          showToast(`Password reset email sent to ${email}.`, 'success');
          return;
        } catch {
          showToast('Could not send password reset email.', 'error');
          return;
        }
      }
      showToast(`Password reset instructions prepared for ${email}.`, 'success');
    }

    async function signInWithGoogle() {
      const enteredEmail = normalizeEmail(document.getElementById('authEmail')?.value || '');
      if (supabaseClient) {
        try {
          const { error } = await supabaseClient.auth.signInWithOAuth({ provider: 'google' });
          if (error) {
            showToast(error.message, 'error');
          }
          return;
        } catch {
          showToast('Google OAuth request failed.', 'error');
          return;
        }
      }

      if (!enteredEmail || !isValidGmailAddress(enteredEmail)) {
        showToast('Enter a valid @gmail.com address to continue with Google.', 'error');
        return;
      }

      let existing = (state.users || []).find((u) => normalizeEmail(u.email) === enteredEmail);
      if (!existing) {
        if (state.requireApprovedGmailForSignup && !isApprovedGmailForSignup(enteredEmail)) {
          showToast(`"${enteredEmail}" is not in the approved Gmail list.`, 'error');
          return;
        }
        existing = { id: 'u-' + Date.now(), email: enteredEmail, fullName: enteredEmail.split('@')[0], roles: [], password: '' };
        state.users.push(existing);
      }

      const roles = Array.isArray(existing.roles) ? existing.roles : [];
      if (state.exclusiveOwnerOnlyMe && roles.includes('owner') && !canReceiveOwnerRole(existing.email)) {
        existing.roles = roles.filter((r) => r !== 'owner');
      }
      const effectiveRoles = Array.isArray(existing.roles) ? existing.roles : [];

      state.currentUser = { email: existing.email, fullName: existing.fullName };
      if (effectiveRoles.includes('owner') && canReceiveOwnerRole(existing.email)) state.activeRole = 'owner';
      else if (effectiveRoles.includes('admin')) state.activeRole = 'admin';
      else if (effectiveRoles.includes('stock_manager')) state.activeRole = 'stock_manager';
      else if (effectiveRoles.includes('order_manager')) state.activeRole = 'order_manager';
      else state.activeRole = 'customer';

      state.authModal = null;
      saveState();
      showToast(`Signed in with Google as ${existing.email}.`, 'success');
      render();
    }

    async function handleAuthSubmit(e, mode) {
      e.preventDefault();
      const email = normalizeEmail(document.getElementById('authEmail').value);
      const password = document.getElementById('authPassword').value;
      const fullName = mode === 'signup' ? document.getElementById('authFullName').value.trim() : email.split('@')[0];

      if (mode === 'signup') {
        const status = getSignupGmailStatus(email);
        if (!status.ok) {
          refreshLiveAuthStatus();
          showToast(status.message.replace(/^✗\s*/, ''), 'error');
          return;
        }
      } else {
        const loginStatus = getLoginGmailStatus(email);
        if (!loginStatus.ok && !supabaseClient) {
          refreshLiveAuthStatus();
          showToast(loginStatus.message.replace(/^✗\s*/, ''), 'error');
          return;
        }
      }

      if (supabaseClient) {
        try {
          const res =
            mode === 'signup'
              ? await supabaseClient.auth.signUp({ email, password, options: { data: { full_name: fullName } } })
              : await supabaseClient.auth.signInWithPassword({ email, password });
          if (res.error) {
            showToast(res.error.message, 'error');
            return;
          }
        } catch (err) {
          showToast('Supabase authentication request failed.', 'error');
          return;
        }
      }

      let existing = state.users.find((u) => normalizeEmail(u.email) === email);
      if (!existing) {
        if (mode !== 'signup') {
          showToast(`Account for "${email}" does not exist. Please sign up first.`, 'error');
          return;
        }
        existing = { id: 'u-' + Date.now(), email, fullName, roles: [], password };
        state.users.push(existing);
      } else {
        const rolesArr = Array.isArray(existing.roles) ? existing.roles : [];
        const isOwnerAccount = rolesArr.includes('owner');
        const expectedPassword = existing.password || (isOwnerAccount ? DEFAULT_OWNER_PASSWORD : '');
        if (mode !== 'signup') {
          if (!expectedPassword || password !== expectedPassword) {
            showToast('Wrong password! Login blocked.', 'error');
            return;
          }
        } else if (fullName) {
          existing.fullName = fullName;
          existing.password = password;
        }
      }

      const rolesAfter = Array.isArray(existing.roles) ? existing.roles : [];
      if (state.exclusiveOwnerOnlyMe && rolesAfter.includes('owner') && !canReceiveOwnerRole(existing.email)) {
        existing.roles = rolesAfter.filter((r) => r !== 'owner');
      }
      const effectiveRoles = Array.isArray(existing.roles) ? existing.roles : [];

      state.currentUser = { email: existing.email, fullName: existing.fullName };
      if (effectiveRoles.includes('owner') && canReceiveOwnerRole(existing.email)) state.activeRole = 'owner';
      else if (effectiveRoles.includes('admin')) state.activeRole = 'admin';
      else if (effectiveRoles.includes('stock_manager')) state.activeRole = 'stock_manager';
      else if (effectiveRoles.includes('order_manager')) state.activeRole = 'order_manager';
      else state.activeRole = 'customer';

      state.authModal = null;
      saveState();
      showToast(`Signed in as ${existing.email} (${state.activeRole}).`, 'success');
      render();
    }

    async function logoutUser() {
      if (supabaseClient) {
        try {
          await supabaseClient.auth.signOut();
        } catch {
          // Ignore network sign-out error in preview mode
        }
      }
      state.currentUser = null;
      state.activeRole = 'customer';
      if (state.activeRoute === 'admin') {
        state.activeRoute = 'home';
      }
      saveState();
      showToast('Logged out.', 'success');
      render();
    }

    function openSupabaseModal() {
      if (!canSeeStaffAdminControls()) {
        showToast('Only staff, admin, or owner can access Supabase Config.', 'error');
        return;
      }
      state.supabaseModalOpen = true;
      render();
    }

    function closeSupabaseModal() {
      state.supabaseModalOpen = false;
      render();
    }

    function saveSupabaseConfig(e) {
      e.preventDefault();
      if (!canSeeStaffAdminControls()) {
        showToast('Only staff, admin, or owner can update Supabase Config.', 'error');
        return;
      }
      state.supabaseUrl = document.getElementById('sbUrlInput').value.trim();
      state.supabaseAnonKey = document.getElementById('sbKeyInput').value.trim();
      initSupabaseIfConfigured();
      state.supabaseModalOpen = false;
      saveState();
      showToast('Supabase configuration saved.', 'success');
      render();
    }

    function copyText(text, successMsg) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).catch(() => {});
        }
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      } catch {
        // Fallback if clipboard API is restricted
      }
      showToast(successMsg, 'success');
    }

    // Root render function
    function render() {
      try {
        const app = document.getElementById('app');
        if (!app) return;
        const isPcMode = state.viewMode === 'pc';
        app.className = isPcMode
          ? 'flex-1 flex flex-col w-full min-w-[1280px]'
          : 'flex-1 flex flex-col w-full max-w-full overflow-x-hidden';
        let bodyHtml = '';
        if (state.activeRoute === 'home') bodyHtml = renderHomePage();
        else if (state.activeRoute === 'robux') bodyHtml = renderRobuxPage();
        else if (state.activeRoute === 'fivem') bodyHtml = renderFivemPage();
        else if (state.activeRoute === 'discord') bodyHtml = renderDiscordPage();
        else if (state.activeRoute === 'marketplace') bodyHtml = renderMarketplacePage();
        else if (state.activeRoute === 'product') bodyHtml = renderProductDetailPage();
        else if (state.activeRoute === 'checkout') bodyHtml = renderCheckoutPage();
        else if (state.activeRoute === 'orders') bodyHtml = renderOrdersPage();
        else if (state.activeRoute === 'support') bodyHtml = renderSupportPage();
        else if (state.activeRoute === 'admin') bodyHtml = renderAdminPage();
        else bodyHtml = renderHomePage();

        app.innerHTML = renderNavbar() + bodyHtml + renderFooter() + renderModalsAndToast();
      } catch (err) {
        console.error('Render error:', err);
      }
    }

    // Live countdown ticker without interrupting active form typing
    setInterval(() => {
      state.nowTick = Date.now();
      const activeTag = document.activeElement && document.activeElement.tagName;
      const isTyping = activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT';
      if (!isTyping && state.robux.restockAt && (state.activeRoute === 'home' || state.activeRoute === 'robux' || state.activeRoute === 'admin')) {
        render();
      }
    }, 1000);

    render();
  </script>
</body>
</html>
